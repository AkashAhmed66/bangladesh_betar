; Bangladesh Betar — PHP runtime tuning for large single-file audio ingestion (M02).
; Must be >= nginx `client_max_body_size` (512M) so PHP-FPM does not reject uploads
; that nginx already accepted. post_max_size must be >= upload_max_filesize.
upload_max_filesize = 512M
post_max_size = 520M
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
max_file_uploads = 20
